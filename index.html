    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
      const layerImg = document.querySelector(".layer-1 img");

      document.addEventListener("mousemove", (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) / 4;
        const moveY = (e.clientY - window.innerHeight / 2) / 4;
        layerImg.style.transform = `translate(${moveX}px, ${moveY}px)`;
      });

      document.addEventListener("mouseleave", () => {
        layerImg.style.transform = `translate(0px, 0px)`;
      });

      // Email--js

      (function () {
        emailjs.init("b8bLCehoXiaD0jcId"); // replace with your EmailJS public key
      })();

      document.getElementById("notifyBtn").addEventListener("click", () => {
        const email = document.getElementById("emailInput").value.trim();
        if (!email) {
          alert("Please enter your email!");
          return;
        }

        emailjs
          .send("service_c3aomk9", "template_kyosuk9", {
            user_email: email,
          })
          .then(() => {
            alert("Thank you! We'll notify you soon.");
            document.getElementById("emailInput").value = "";
          })
          .catch((error) => {
            alert("Something went wrong. Please try again later.");
            console.error(error);
          });
      });
    </script>
